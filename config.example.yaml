version: 2

# Remote account pool. When accounts_source.url is set, the gateway fetches the
# account list from that URL at startup (startup fails if the first fetch fails)
# and refreshes it every refresh_interval seconds. If a later refresh fails, the
# previously loaded accounts keep serving. The remote document must look like:
#   {"accounts": [{"name": ..., "token": ..., "agent_id": ..., "workspace_id": ...}]}
# accounts_source cannot be combined with accounts / tasklet / adapters / models.
#
# accounts_source:
#   type: url
#   url: "https://tusi.catbye.com/fandai/fandai.json"
#   refresh_interval: 600

# Multi-account mode. Requests use model "tasklet" and accounts are selected
# round-robin. api_url and timezone are optional.
accounts:
  - name: "account1"
    token: "YOUR_TOKEN_1"
    agent_id: "YOUR_AGENT_ID_1"
    workspace_id: "YOUR_WORKSPACE_ID_1"
  - name: "account2"
    token: "YOUR_TOKEN_2"
    agent_id: "YOUR_AGENT_ID_2"
    workspace_id: "YOUR_WORKSPACE_ID_2"
    timezone: "Asia/Singapore"
    # api_url: "https://api.tasklet.ai/api/sendChatMessage"
