services:
  fandai:
    build: .
    image: fandai:latest
    container_name: fandai
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      FANDAI_CONFIG: /app/config.yaml
      FANDAI_LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
